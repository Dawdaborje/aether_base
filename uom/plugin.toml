[plugin]
name = "uom"
label = "Units of Measure"
version = "0.1.0"
description = "Units of measure and conversion categories."
authors = [{ name = "Aether", email = "hello@aether.local" }]
dependencies = ["base_components", "security_templates"]
capabilities = ["db::query", "db::mutate"]
is_builtin = true

[plugin.api]
version = "0.1"

[plugin.meta]
kind = "addon"
workspace = "base"

[communication]
channels = ["events"]

[[models]]
name = "uom_category"
table = "base_uom_category"
file = "./models/uom.surql"

[[models]]
name = "uom"
table = "base_uom"
file = "./models/uom.surql"

[[pages]]
route = "/base/uom"
title = "Units of Measure"
file = "./pages/uom.xml"
model = "base.uom"

[[menus]]
name = "uom"
label = "UoM"
icon = "ruler"
url = "/base/uom"
order = 70
parent = "base_root"

[[hooks]]
name = "on_install"
phase = "install"
handler = "hooks.on_install"

[[permissions]]
key = "uom.read"
label = "Read UoM"

[[permissions]]
key = "uom.write"
label = "Manage UoM"
