[plugin]
name = "attachment"
label = "Attachments"
version = "0.1.0"
description = "Link kernel media objects to arbitrary business records."
authors = [{ name = "Aether", email = "hello@aether.local" }]
dependencies = ["base_components", "security_templates"]
capabilities = ["db::query", "db::mutate", "storage::read", "storage::write", "storage::delete"]
is_builtin = true

[plugin.api]
version = "0.1"

[plugin.meta]
kind = "addon"
workspace = "base"

[communication]
channels = ["events"]

[[models]]
name = "attachment"
table = "base_attachment"
file = "./models/attachment.surql"

[[pages]]
route = "/base/attachments"
title = "Attachments"
file = "./pages/attachments.xml"
model = "base.attachment"

[[menus]]
name = "attachments"
label = "Attachments"
icon = "paperclip"
url = "/base/attachments"
order = 85
parent = "base_root"
visible = false

[[hooks]]
name = "on_install"
phase = "install"
handler = "hooks.on_install"

[[events]]
name = "attachment.linked"
direction = "emit"

[[permissions]]
key = "attachment.read"
label = "Read attachments"

[[permissions]]
key = "attachment.write"
label = "Manage attachments"
