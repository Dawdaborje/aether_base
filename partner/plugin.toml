[plugin]
name = "partner"
label = "Partners"
version = "0.1.0"
description = "Contacts — customers, vendors, and people shared across ERP/CRM/HRMS/LMS."
long_description = "Canonical partner/contact master data. Kernel users stay in core; partners are org business records."
authors = [{ name = "Aether", email = "hello@aether.local" }]
dependencies = ["base_components", "security_templates", "currency"]
capabilities = ["db::query", "db::mutate", "events::emit"]
is_builtin = true

[plugin.api]
version = "0.1"

[plugin.meta]
kind = "addon"
workspace = "base"

[communication]
channels = ["events"]

[[models]]
name = "partner"
table = "base_partner"
label = "Partner"
file = "./models/partner.surql"

[[pages]]
route = "/base/partners"
title = "Contacts"
file = "./pages/partners.xml"
model = "base.partner"
view = "list"

[[pages]]
route = "/base/partners/form"
title = "Partner"
file = "./pages/partner_form.xml"
model = "base.partner"
view = "form"

[[menus]]
name = "partners"
label = "Contacts"
icon = "users"
url = "/base/partners"
order = 10
parent = "base_root"

[[hooks]]
name = "on_install"
phase = "install"
handler = "hooks.on_install"

[[hooks]]
name = "on_partner_create"
phase = "request"
event = "model.create"
model = "base.partner"
handler = "hooks.on_partner_create"

[[events]]
name = "partner.created"
direction = "emit"
payload = "partner_id"

[[events]]
name = "partner.updated"
direction = "emit"
payload = "partner_id"

[[permissions]]
key = "partner.read"
label = "Read partners"

[[permissions]]
key = "partner.write"
label = "Write partners"

[[permissions]]
key = "partner.delete"
label = "Delete partners"
