[plugin]
name = "currency"
icon_path = "assets/logo.svg"
label = "Currencies"
version = "0.3.2"
description = "Currencies and exchange rates for business documents."
long_description = """
Currencies with their rates against one base currency, and conversion between any two of them at a
given date. Install/upgrade seeds ~65 currencies in common use (USD as base). Written in Rhai:
the plugin is the single file `main.rhai`.
"""
authors = [{ name = "Aether", email = "hello@aether.local" }]
dependencies = ["base_ui"]
capabilities = ["db::query", "db::mutate", "db::transaction", "events::emit"]
access_models = [
  { name = "currency", permissions = ["read", "write"] },
  { name = "currency_rate", permissions = ["read", "write"] },
]
is_builtin = true
script = "main.rhai"

# Announced to plugins that depend on this one and listen (see docs/architecture/events.md).
[[events]]
name = "rate_changed"

[[command]]
name = "seed"
function = "seed_currencies"
help = "Create the currencies in common use (idempotent); the first run also makes USD the base currency"
on_install = true
on_upgrade = true

[[command]]
name = "demo_currency_rate"
function = "generate_demo_currency_rate"
help = "Generate demo exchange rates for non-base currencies"
demo_model = "currency_rate"
args = [{ name = "count", type = "int", default = 10 }]

[app]
icon = "banknote"
route = "/base/currencies"
description = "Currencies and exchange rates"

[plugin.api]
version = "0.1"

[plugin.meta]
kind = "addon"
workspace = "base"
