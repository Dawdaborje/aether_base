[plugin]
name = "currency"
label = "Currencies"
version = "0.1.0"
description = "Currencies and exchange rates for business documents."
authors = [{ name = "Aether", email = "hello@aether.local" }]
dependencies = ["base_components", "security_templates"]
capabilities = ["db::query", "db::mutate"]
is_builtin = true

[plugin.api]
version = "0.1"

[plugin.meta]
kind = "addon"
workspace = "base"

[communication]
channels = ["events"]

[[models]]
name = "currency"
table = "base_currency"
file = "./models/currency.surql"

[[models]]
name = "currency_rate"
table = "base_currency_rate"
file = "./models/currency.surql"

[[pages]]
route = "/base/currencies"
title = "Currencies"
file = "./pages/currencies.xml"
model = "base.currency"

[[menus]]
name = "currencies"
label = "Currencies"
icon = "banknote"
url = "/base/currencies"
order = 75
parent = "base_root"

[[hooks]]
name = "on_install"
phase = "install"
handler = "hooks.on_install"

[[events]]
name = "currency.rate_updated"
direction = "emit"

[[permissions]]
key = "currency.read"
label = "Read currencies"

[[permissions]]
key = "currency.write"
label = "Manage currencies"
