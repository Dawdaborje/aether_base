[workspace]
name = "base"
label = "Aether Base"
version = "0.2.0"
description = "Business foundation for Aether plugins: currencies, countries, parties and companies."
long_description = """
Always-installed foundation workspace. Kernel facets own identity, tenancy, and RBAC;
this workspace owns the business primitives (currency, country, party, company, …) that
ERP/CRM/HRMS/LMS depend on.

Load order matters (a plugin must be loaded after the ones it links to): currency, country, party, company, calendar.
"""
authors = [{ name = "Aether", email = "hello@aether.local" }]
website = "https://github.com/Dawdaborje"
categories = ["base"]
group_label = "Base"
group_icon = "./assets/base.svg"
dependencies = []

[workspace.plugins]
currency = { path = "./currency" }
country = { path = "./country" }
party = { path = "./party" }
company = { path = "./company" }
calendar = { path = "./calendar" }
