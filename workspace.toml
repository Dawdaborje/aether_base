[workspace]
name = "base"
label = "Aether Base"
version = "0.2.0"
description = "Business/UI foundation for Aether plugins — shared XML, themes, and core business addons."
long_description = """
Always-installed foundation workspace. Kernel facets own identity, tenancy, and RBAC;
this workspace owns shared page XML, themes, and business primitives (partner, sequence,
uom, currency, mail, product, …) that ERP/CRM/HRMS/LMS depend on.

Plugin API contract: see docs/PLUGIN_API.md (v0.1, evolving).
"""
authors = [{ name = "Aether", email = "hello@aether.local" }]
website = "https://github.com/Dawdaborje"
categories = ["base", "themes", "ui"]
group_label = "Base"
group_icon = "./assets/base.svg"
dependencies = []


[[addons]]
name = "currency"
path = "./currency"

# --- Themes ---
[[addons]]
name = "theme_enterprise"
path = "./theme_enterprise"

[[addons]]
name = "theme_nordic"
path = "./theme_nordic"

[[addons]]
name = "theme_graphite"
path = "./theme_graphite"

[[addons]]
name = "theme_ocean"
path = "./theme_ocean"

[[addons]]
name = "theme_forest"
path = "./theme_forest"

[[addons]]
name = "theme_midnight"
path = "./theme_midnight"
