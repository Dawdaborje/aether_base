Always-installed foundation workspace. Kernel facets own identity, tenancy, and RBAC;
this workspace owns shared page XML, themes, and business primitives (partner, sequence,
uom, currency, mail, product, …) that ERP/CRM/HRMS/LMS depend on.

Plugin API contract: see docs/PLUGIN_API.md (v0.1, evolving).
"""
