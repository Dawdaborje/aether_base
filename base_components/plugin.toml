[plugin]
name = "base_components"
label = "Base Components"
version = "0.1.0"
description = "Shared XML page templates and UI building blocks for other Aether plugins."
long_description = """
Provides reusable .xml fragments (toolbars, list/form shells, empty states, dialogs)
that ERP/CRM and theme plugins can include or extend. No business domain models —
platform identity lives in the kernel.
"""
authors = [{ name = "Aether", email = "hello@aether.local" }]
website = "https://github.com/Dawdaborje"
dependencies = []
capabilities = ["db::query"]
is_builtin = true

[plugin.api]
version = "0.1"

[plugin.meta]
kind = "addon"
workspace = "base"

[communication]
channels = []

[[pages]]
route = "/base/demo"
title = "Base demo"
file = "./pages/demo.xml"

[[menus]]
name = "base_root"
label = "Base"
icon = "layers"
url = "/base"
order = 0
visible = false

[[hooks]]
name = "on_install"
phase = "install"
handler = "hooks.on_install"
