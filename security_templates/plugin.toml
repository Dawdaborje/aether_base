[plugin]
name = "security_templates"
label = "Security Templates"
version = "0.1.0"
description = "Default org permission keys and groups that other base/ERP addons extend."
long_description = "Does not replace kernel RBAC tables — seeds permission catalog rows plugins declare."
authors = [{ name = "Aether", email = "hello@aether.local" }]
dependencies = ["base_components"]
capabilities = ["db::query", "db::mutate"]
is_builtin = true

[plugin.api]
version = "0.1"

[plugin.meta]
kind = "addon"
workspace = "base"

[communication]
channels = []

[[hooks]]
name = "on_install"
phase = "install"
handler = "hooks.on_install"

[[permissions]]
key = "base.access"
label = "Access base apps"
