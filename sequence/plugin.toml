[plugin]
name = "sequence"
label = "Sequences"
version = "0.1.0"
description = "Document number sequences (INV/2026/001, SO/…)."
authors = [{ name = "Aether", email = "hello@aether.local" }]
dependencies = ["base_components", "security_templates"]
capabilities = ["db::query", "db::mutate"]
is_builtin = true

[plugin.api]
version = "0.1"

[plugin.meta]
kind = "addon"
workspace = "base"

[communication]
channels = ["events"]

[[models]]
name = "sequence"
table = "base_sequence"
file = "./models/sequence.surql"

[[pages]]
route = "/base/sequences"
title = "Sequences"
file = "./pages/sequences.xml"
model = "base.sequence"

[[menus]]
name = "sequences"
label = "Sequences"
icon = "hash"
url = "/base/sequences"
order = 80
parent = "base_root"

[[hooks]]
name = "on_install"
phase = "install"
handler = "hooks.on_install"

[[hooks]]
name = "next_value"
phase = "request"
handler = "hooks.next_value"

[[events]]
name = "sequence.consumed"
direction = "emit"

[[permissions]]
key = "sequence.read"
label = "Read sequences"

[[permissions]]
key = "sequence.write"
label = "Manage sequences"
